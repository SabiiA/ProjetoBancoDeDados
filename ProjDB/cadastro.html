<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente</title>
    <link rel="stylesheet" href="cadastro/style.css">
</head>
<body>

    <main class="container">
        <section class="cadastro">
            <a href="sitejoias.html" class="voltar">← Voltar ao início</a>
            <div class="logo">Brilha Muito<span>✦</span></div>

            <h1>Criar conta</h1>

            <p class="subtitulo">
                Descubra peças que contam a sua história.
            </p>

            <form id="formCadastro">

                <div class="campo">
                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" required
                           placeholder="Seu nome completo">
                </div>

                <div class="campo">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" required
                           placeholder="seuemail@exemplo.com">
                </div>

                <div class="campo">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" required
                           placeholder="Crie uma senha">
                </div>

                <div class="campo">
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" required
                           placeholder="(19) 99999-9999">
                </div>

                <button type="submit">Cadastrar</button>

            </form>

            <p class="login">
                Já tem uma conta?
                <a href="#">Entrar</a>
            </p>

        </section>

        <section class="imagem">
            <div class="frase">
                <span>BELEZA EM CADA DETALHE</span>
                <h2>Mais que joias,<br> histórias para guardar.</h2>
            </div>
        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>
